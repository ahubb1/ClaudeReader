name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      FLTK_VERSION: 1.4.5
    steps:
      - uses: actions/checkout@v7

      - name: Install the libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config xvfb python3-pil \
            libopencv-dev libmupdf-dev libmujs-dev libjbig2dec0-dev libopenjp2-7-dev libjpeg-dev \
            libfreetype-dev libharfbuzz-dev zlib1g-dev libarchive-dev libcurl4-openssl-dev libgumbo-dev liblua5.4-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev \
            libcairo2-dev libpango1.0-dev libglu1-mesa-dev libpng-dev

      # Ubuntu 24.04 has FLTK 1.3 only: FLTK 1.4 built once, then cached
      - name: Restore FLTK
        id: fltk-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/fltk
          key: fltk-${{ env.FLTK_VERSION }}-ubuntu-24.04

      - name: Build FLTK
        if: steps.fltk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-$FLTK_VERSION https://github.com/fltk/fltk.git /tmp/fltk
          cmake -S /tmp/fltk -B /tmp/fltk-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/fltk \
            -DFLTK_BUILD_TEST=OFF -DFLTK_BUILD_EXAMPLES=OFF -DFLTK_BUILD_FLUID=OFF -DFLTK_BUILD_FLTK_OPTIONS=OFF \
            -DFLTK_BACKEND_WAYLAND=OFF
          cmake --build /tmp/fltk-build
          cmake --install /tmp/fltk-build

      # Saved right away: kept even if a later step fails
      - name: Save FLTK
        if: steps.fltk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/fltk
          key: fltk-${{ env.FLTK_VERSION }}-ubuntu-24.04

      - name: Build ClaudeReader
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$HOME/fltk
          cmake --build build

      - name: Panel detection check
        run: |
          python3 tests/make_test_comic.py test.cbz
          mkdir panels
          xvfb-run -a ./build/ClaudeReader -e test.cbz panels .jpg
          count=$(ls panels | wc -l)
          echo "Exported panels: $count"
          test "$count" -eq 31   # 4 whole pages, then 4, 6, 6 and 9 panels with their page
          ./build/ClaudeReader --version

      - name: Package
        run: |
          mkdir -p ClaudeReader-linux-x86_64
          cp build/ClaudeReader README.md CHANGES ClaudeReader-linux-x86_64/
          cp share/bdreader.desktop ClaudeReader-linux-x86_64/claudereader.desktop
          tar czf ClaudeReader-linux-x86_64.tar.gz ClaudeReader-linux-x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeReader-linux-x86_64
          path: ClaudeReader-linux-x86_64.tar.gz

  windows:
    name: Windows (MSYS2, single exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-fltk mingw-w64-ucrt-x86_64-opencv
            mingw-w64-ucrt-x86_64-mupdf mingw-w64-ucrt-x86_64-libarchive mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-gumbo-parser mingw-w64-ucrt-x86_64-lua mingw-w64-ucrt-x86_64-python-pillow

      # Build with the DLLs (as for development)
      - name: Build ClaudeReader
        run: ./build.sh

      # The static OpenCV for the single exe: built once, then cached
      - name: Cache the static OpenCV
        id: opencv-cache
        uses: actions/cache@v6
        with:
          path: deps/opencv-static
          key: opencv-static-${{ hashFiles('deps/build-opencv.sh') }}

      - name: Build the static OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: deps/build-opencv.sh

      - name: Build the single exe
        run: ./build.sh --static

      - name: Panel detection check
        run: |
          python tests/make_test_comic.py test.cbz
          mkdir panels
          ./build-static/ClaudeReader.exe -e test.cbz panels .jpg
          count=$(ls panels | wc -l)
          echo "Exported panels: $count"
          test "$count" -eq 31   # 4 whole pages, then 4, 6, 6 and 9 panels with their page
          # The single exe must only use the DLLs of Windows itself
          others=$(objdump -p build-static/ClaudeReader.exe | sed -n 's/.*DLL Name: //p' | grep -viE \
            '^(api-ms-win-.*|kernel32|user32|gdi32|advapi32|shell32|ole32|comctl32|comdlg32|ws2_32|crypt32|secur32|bcrypt|dwmapi|dwrite|usp10|rpcrt4|iphlpapi|wldap32|winspool|xmllite)\.(dll|drv)$' || true)
          if [ -n "$others" ]; then echo "Not Windows DLLs: $others"; exit 1; fi

      - name: Package
        run: |
          mkdir -p ClaudeReader
          cp build-static/ClaudeReader.exe ClaudeReader/
          cp README.md ClaudeReader/README.md
          cp CHANGES ClaudeReader/CHANGES.txt
          cp doc/License.txt ClaudeReader/LICENSE.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeReader-windows-x64
          path: ClaudeReader

  # A version tag (v1.1, v1.1-beta.1...) publishes a release with the two executables only
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ClaudeReader-linux-x86_64
          path: linux

      - uses: actions/download-artifact@v8
        with:
          name: ClaudeReader-windows-x64
          path: windows

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar xzf linux/ClaudeReader-linux-x86_64.tar.gz
          mkdir assets
          cp ClaudeReader-linux-x86_64/ClaudeReader assets/ClaudeReader-linux-x86_64
          cp windows/ClaudeReader.exe assets/ClaudeReader-windows-x64.exe
          version=${GITHUB_REF_NAME#v}
          {
            echo "**Windows**: download \`ClaudeReader-windows-x64.exe\` and run it, nothing to install (Windows 10 or 11, 64-bit)."
            echo
            echo "**Linux**: download \`ClaudeReader-linux-x86_64\`, make it executable (\`chmod +x ClaudeReader-linux-x86_64\`) and run it."
            echo "Built on Ubuntu 24.04: it uses the system OpenCV, MuPDF, libarchive, curl and gumbo libraries (see the README)."
            echo
            echo "Changes: see [CHANGES](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGES)."
          } > notes.md
          # A tag with a "-" (v1.1-beta.1) is a pre-release
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "ClaudeReader $version" --notes-file notes.md $prerelease
